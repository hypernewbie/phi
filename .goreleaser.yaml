version: 2
project_name: phi

before:
  hooks:
    - go mod tidy

builds:
  # Server build. Embeds the web assets so the binary is
  # self-contained.
  - id: phi
    main: .
    binary: phi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -tags=embedassets
    ldflags:
      - >-
        -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}
        -X main.Date={{.Date}} -X main.BuildSource=release

  # Native VT console: CGO is mandatory. The cross-target release compiler
  # must be configured before publication; never ship an emulator-less stub.
  # The build id is "phic" so the
  # archive is phi_<version>_<os>_<arch>_phic.tar.gz.
  - id: phic
    main: ./cmd/phic
    binary: phic
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}
        -X main.Date={{.Date}}

archives:
  - id: phi
    ids: [phi]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
  - id: phic
    ids: [phic]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_phic

checksum:
  name_template: "checksums.txt"

# Keep the GitHub release private until every independently-built asset has
# uploaded successfully; publish-release flips the draft after that final gate.
release:
  draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
