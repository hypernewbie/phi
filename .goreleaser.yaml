version: 2
project_name: phi

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -tags=embedassets
    ldflags:
      - >-
        -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}
        -X main.Date={{.Date}} -X main.BuildSource=release

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Keep the GitHub release private until every independently-built asset has
# uploaded successfully; publish-release flips the draft after that final gate.
release:
  draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
