version: 2
project_name: phi

before:
  hooks:
    - go mod tidy

builds:
  # Server build. Embeds the web assets so the binary is self-contained.
  # Pure Go: the server links no virtual terminal and needs no C toolchain,
  # so every target cross-compiles from any host with the plain Go
  # toolchain. Darwin used to need a macOS runner only because the server
  # linked CGO; it still ships from the darwin-build job for checksum
  # symmetry with phic, which does require CGO.
  - id: phi
    main: .
    binary: phi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -tags=embedassets
    ldflags:
      - >-
        -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}
        -X main.Date={{.Date}} -X main.BuildSource=release

  # Native VT console: CGO is mandatory; never ship an emulator-less stub.
  # Linux targets cross-compile with pinned zig cc from any host. Darwin
  # targets cannot zig-cross-link (no macOS system libraries), so the
  # darwin-build macOS job produces those archives; goreleaser picks
  # them up for checksums and this job uploads them to the draft release.
  # The archive is phi_<version>_<os>_<arch>_phic.tar.gz with the binary at
  # its root.
  - id: phic
    main: ./cmd/phic
    binary: phic
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}}
        -X main.Date={{.Date}}

archives:
  - id: phi
    ids: [phi]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
  - id: phic
    ids: [phic]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_phic

checksum:
  name_template: "checksums.txt"
  # Darwin archives (phi and phic) are built on a macOS runner (zig cannot
  # cross-link macOS system libraries); they still belong in checksums.txt.
  extra_files:
    - glob: prebuilt/*.tar.gz

# Keep the GitHub release private until every independently-built asset has
# uploaded successfully; publish-release flips the draft after that final gate.
release:
  draft: true
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
