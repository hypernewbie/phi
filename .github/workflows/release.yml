name: Release

on:
  push:
    tags:
      - "v*"

# OIDC trusted publishing needs id-token: write for the npm-publish job.
# Long-lived NPM_TOKEN secret is being phased out by npm (2FA-bypass tokens
# lose publish capability in Jan 2027 per
# https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
# See .github/dependabot.yml / repo settings: trusted publishing must be
# enabled for @hypernewbie/phi-code on npmjs.com pointing at this repo +
# the release.yml workflow file path.
permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Build the frontend BEFORE GoReleaser so the embedded web/ (//go:embed
      # all:web) reflects the current web-src/*.ts, not whatever compiled JS
      # happened to be committed. Keeps release artifacts authoritative.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Build web assets
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:web
          go run ./tools/webdist

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pet-package:
    name: Pet package
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pet/pnpm-lock.yaml

      - name: Install pet dependencies
        run: pnpm --dir desktop/pet install --frozen-lockfile

      - name: Typecheck pet
        run: pnpm --dir desktop/pet typecheck

      - name: Test pet
        run: pnpm --dir desktop/pet test

      - name: Build pet
        run: pnpm --dir desktop/pet build

      - name: Package and compare pet archive members
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          archive="phi-pet-${version}.tar.gz"
          for input in dist assets package.json LICENSE-dsh-pet.txt; do
            test -e "desktop/pet/$input"
            test ! -L "desktop/pet/$input"
          done
          if find desktop/pet/dist desktop/pet/assets -type l -print -quit \
            | grep -q .; then
            echo 'Pet package inputs must not contain symlinks.' >&2
            exit 1
          fi
          tar -czf "$archive" -C desktop/pet \
            dist assets package.json LICENSE-dsh-pet.txt
          expected=$(mktemp)
          actual=$(mktemp)
          trap 'rm -f "$expected" "$actual"' EXIT
          (cd desktop/pet && {
            find dist assets -type f -print
            printf '%s\n' package.json LICENSE-dsh-pet.txt
          }) | LC_ALL=C sort -u > "$expected"
          tar -tzf "$archive" | sed '/\/$/d' | LC_ALL=C sort -u > "$actual"
          diff -u "$expected" "$actual"
          # The sorted comparison above is the complete archive-content gate.

      - name: Sign pet archive
        working-directory: desktop/electron
        env:
          PHI_PET_ED25519_PRIVATE_KEY: >-
            ${{ secrets.PHI_PET_ED25519_PRIVATE_KEY }}
        run: |
          node scripts/sign-pet-package.mjs \
            --archive "../../phi-pet-${GITHUB_REF_NAME#v}.tar.gz" \
            --out "../../phi-pet-${GITHUB_REF_NAME#v}.manifest.json"

      - name: Upload signed pet assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            "phi-pet-${GITHUB_REF_NAME#v}.tar.gz" \
            "phi-pet-${GITHUB_REF_NAME#v}.manifest.json" --clobber

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/electron/pnpm-lock.yaml

      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: pnpm install --frozen-lockfile

      # Packaging is intentionally the only desktop validation here. The
      # hosted runners produce the native installers, but cannot replace the
      # real-machine smoke pass for the retained WebContentsView shell.
      - name: Set release version
        shell: bash
        working-directory: desktop/electron
        run: |
          pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version \
            --allow-same-version

      - name: Build desktop app
        working-directory: desktop/electron
        run: pnpm run build

      - name: Package desktop app
        working-directory: desktop/electron
        shell: bash
        run: |
          pnpm exec electron-builder --config electron-builder.json \
            --publish never

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: phi-client-desktop-${{ matrix.os }}
          path: |
            desktop/electron/out/phi-client-*.exe
            desktop/electron/out/phi-client-*.dmg
            desktop/electron/out/phi-client-*.zip
            desktop/electron/out/phi-client-*.AppImage
            desktop/electron/out/phi-client-*.snap
            desktop/electron/out/phi-client-*.deb
            desktop/electron/out/phi-client-*.rpm
            desktop/electron/out/phi-client-*.tar.gz
            !desktop/electron/out/*.__uninstaller.exe
            !desktop/electron/out/*.blockmap
          if-no-files-found: error

  desktop-release:
    name: Attach desktop packages to release
    needs: [goreleaser, pet-package, desktop-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: phi-client-desktop-*
          path: desktop-release
          merge-multiple: true

      - name: Upload desktop packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          uploaded=0
          while IFS= read -r -d '' file; do
            gh release upload --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
              "$file" --clobber
            uploaded=1
          done < <(find desktop-release -type f -print0)
          if [ "$uploaded" -eq 0 ]; then
            echo 'No desktop package files were downloaded.' >&2
            exit 1
          fi

  npm-publish:
    needs: [goreleaser, desktop-release]
    # Pre-release tags exercise the pipeline (pet signing, desktop
    # packaging) without publishing: an npm publish of a prerelease
    # version would take over the `latest` dist-tag. Cut a real semver
    # tag to publish.
    if: ${{ !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    # actions/setup-node's built-in registry-url auth uses NODE_AUTH_TOKEN
    # when set, but with `registry-url` + OIDC it picks up the auto-minted
    # token from the job's id-token permission automatically.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # The repo root pins `packageManager: pnpm`, and setup-node's
          # dependency cache is on by default -- it reads that field and shells
          # out to pnpm, which is not installed in this job. That failed the
          # v0.16.0 publish after goreleaser had already cut the release.
          # This job only publishes the npm/ wrapper and never installs
          # dependencies, so there is nothing to cache; disabling the cache is
          # the fix rather than adding a pnpm setup step it would not use.
          package-manager-cache: false

      - name: Publish to NPM
        run: |
          version=${GITHUB_REF_NAME#v}
          if npm view "@hypernewbie/phi-code@${version}" version --silent \
            >/dev/null 2>&1; then
            echo "@hypernewbie/phi-code@${version} is already published; \
              skipping duplicate publish"
            exit 0
          fi
          cd npm
          npm version "$version" --no-git-tag-version --allow-same-version
          # --provenance attaches an SLSA build provenance statement signed by
          # GitHub's OIDC token; required by npm's trusted publishing flow.
          npm publish --access=public --provenance
        env:
          # NODE_AUTH_TOKEN intentionally unset: setup-node will use the OIDC
          # token minted for this job. Override with NODE_AUTH_TOKEN secret only
          # for emergency rollback if trusted publishing is misconfigured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
