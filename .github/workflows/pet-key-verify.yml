name: Pet signing key verify

on:
  workflow_dispatch:
  push:
    branches: ["fix/pet-overlay-corrective"]

# One-shot guard for the signed pet overlay: proves the
# PHI_PET_ED25519_PRIVATE_KEY secret is the private half of the public key
# pinned in desktop/electron/src/petPackageTrust.ts. A mismatch means CI
# would happily sign packages no client will accept, so fail loudly here.
jobs:
  verify:
    name: Secret matches pinned public key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compare secret with pinned pet public key
        env:
          PHI_PET_ED25519_PRIVATE_KEY: >-
            ${{ secrets.PHI_PET_ED25519_PRIVATE_KEY }}
        run: node desktop/electron/scripts/verify-pet-signing-key.mjs
