name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Vet (profiling)
        run: go vet -tags=profiling ./...

      - name: Install native terminal test dependency
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run Go Tests
        run: go test -race -v ./...

      - name: Run Go Tests (profiling)
        run: go test -race -tags=profiling ./...

      - name: Run Go Tests (otel tags)
        run: |
          go test -race -tags=otel ./pkg/obs .
          go test -race -tags=profiling,otel ./pkg/obs ./internal/diagnostics .

      # A real native terminal, not the headless screen oracle. No provider
      # credentials, model access, desktop profile, or tmux state is inherited.
      - name: Native phic Shell views and reattachment
        run: python3 scripts/test-phic-native.py --coders bash

      # Release builds embed precompressed assets behind -tags=embedassets
      # (see embed_release.go). Run the root-package tests against that
      # path so it cannot rot behind the tag.
      - name: Release-Tag Assets Smoke
        run: |
          go run ./tools/webdist
          go vet -tags=embedassets ./...
          go test -tags=embedassets -race .
          go test -tags=embedassets,profiling -race .

      # The added profiling implementation must compile out of normal
      # builds. This guard checks source, test, dependency, and symbol
      # selection across all build-tag combinations.
      - name: Profiling Partition Guard
        run: bash scripts/check-profiling-build.sh "$(mktemp -d)/partition"

      # The main server must build with and without the profiling tag
      # on every supported platform. Linux is covered natively above.
      - name: Build server (darwin/windows, both tags)
        run: |
          for goos in darwin windows; do
            GOOS=$goos CGO_ENABLED=0 go build -o /tmp/phi-server-${goos} .
            GOOS=$goos CGO_ENABLED=0 go build -tags=profiling -o /tmp/phi-server-${goos}-profiling .
          done

      # Both binaries link the native VT engine, so cross-builds need a C
      # toolchain per target; the sha256 gate keeps the compiler supply
      # chain fixed. Host linux/amd64 is covered by the full test run above.
      - name: Set up Zig cross compiler
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 600 --retry 2 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | sha256sum --check
          mkdir -p "$HOME/.local/zig-0.16.0"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig-0.16.0" --strip-components=1
          echo "$HOME/.local/zig-0.16.0" >> "$GITHUB_PATH"

      # Compile-only evidence for the foreign targets Ubuntu can link.
      # Darwin cannot zig-cross-link (no macOS system libraries); the
      # macOS job below covers it.
      - name: Native cross-builds (linux arm64, windows amd64)
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-gnu" \
            go build -o /tmp/phi-linux-arm64 .
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-gnu" \
            go build -o /tmp/phic-linux-arm64 ./cmd/phic
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC="zig cc -target x86_64-windows-gnu" \
            go build -o /tmp/phi-windows-amd64.exe .
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC="zig cc -target x86_64-windows-gnu" \
            go build -o /tmp/phic-windows-amd64.exe ./cmd/phic

      # Native tests already run above with -race. Cross-compile the
      # Windows tests with CGO on; Linux cannot execute Windows PE binaries.
      - name: Compile engine tests (Windows, CGO on)
        run: |
          mkdir -p /tmp/phi-windows-tests
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC="zig cc -target x86_64-windows-gnu" \
            go test -c -o /tmp/phi-windows-tests/ \
            ./internal/termstate/... ./internal/termemu/ ./internal/phic/... ./internal/termproof/... ./pkg/ws/wireproto/...

  test-darwin:
    name: Darwin native builds + engine tests
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Both darwin architectures link here; the non-host one is
      # compile-only evidence.
      - name: Build both binaries (arm64 + amd64)
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" go build -o /tmp/phi-darwin-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" go build -o /tmp/phic-darwin-arm64 ./cmd/phic
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -o /tmp/phi-darwin-amd64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -o /tmp/phic-darwin-amd64 ./cmd/phic

      - name: Engine tests (host arch)
        run: go test ./internal/termstate/... ./internal/termemu/

  test-windows:
    name: Windows native builds + engine tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Zig compiler
        shell: pwsh
        run: |
          $url = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'zig-0.16.0.zip'
          curl.exe -fsSL --connect-timeout 15 --max-time 600 --retry 2 $url -o $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') {
            throw "zig checksum mismatch: $hash"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'zig-0.16.0'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $zigDir = Get-ChildItem $dest -Directory | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $zigDir.FullName

      - name: Build both binaries
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:CC = 'zig cc -target x86_64-windows-gnu'
          go build -o (Join-Path $env:RUNNER_TEMP 'phi.exe') .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o (Join-Path $env:RUNNER_TEMP 'phic.exe') ./cmd/phic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Engine tests
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:CC = 'zig cc -target x86_64-windows-gnu'
          go test ./internal/termstate/... ./internal/termemu/

  goreleaser-check:
    name: GoReleaser config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check release config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: latest
          args: check

  test-ts:
    name: TS Build + Type Check + Drift Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter phi-dev --filter @phi/core --filter @phi/web-react

      - name: Check vendored assets
        run: pnpm run check:vendors

      - name: Lint and Format JS/TS
        run: pnpm run check:code

      - name: Lint CSS
        run: pnpm run lint:web

      - name: Type Check (web-src)
        run: pnpm run typecheck

      - name: Build Emitted JS
        run: pnpm run build:web

      - name: Verify WebSocket protobuf generated assets
        run: pnpm run check:websocket-generated

      # Drift guard. If web-src/*.ts sources are out of sync with
      # committed web/*.js artifacts, this fails the build. The
      # porcelain status catches both modified AND untracked files,
      # which a plain git diff --exit-code would not.
      - name: Verify Emitted Artifacts Clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- web)" ]; \
            then
            echo "::error::Emitted web/ tree is out of sync with web-src/."
            git status --porcelain --untracked-files=all -- web
            exit 1
          fi

  test-pet:
    name: Pet Type Check + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Pet Dependencies
        run: pnpm install --frozen-lockfile --filter @phi-desktop/pet

      - name: Type Check Pet
        run: pnpm --filter @phi-desktop/pet run typecheck

      - name: Test Pet
        run: pnpm --filter @phi-desktop/pet test

      - name: Build Pet
        run: pnpm --filter @phi-desktop/pet run build

  test-js:
    name: JS Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # The phic screen oracle reads operations from the Go fixture.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter phi-dev --filter @phi/core --filter @phi/web-react

      # Keep cold Go downloads/compilation outside the JS hooks' 60s limit.
      - name: Compile Go-backed JS fixtures
        run: go test ./internal/phic -run '^$'

      - name: Run JS Tests
        run: pnpm test

      # Electron desktop shell is a root-workspace package. Its postinstall
      # (prebuilt binary download) is approved in the root workspace config.
      # The e2e smoke test remains a local/manual gate because hosted runners
      # do not provide the required desktop display.
      - name: Electron Shell (build + typecheck + tests)
        run: |
          pnpm install --frozen-lockfile --filter phi-desktop-electron
          pnpm --filter phi-desktop-electron run build
          pnpm --filter phi-desktop-electron run typecheck
          pnpm --filter phi-desktop-electron exec vitest run \
            --exclude test/smoke.test.ts

  test-pi-phi:
    name: Pi-Phi Bridge (gen + drift + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # The integration suite builds the Go testserver fixture.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Bridge Dependencies
        run: pnpm install --frozen-lockfile --filter @phi/pi-phi

      # Regenerates the Protobuf bindings and rebuilds the runtime,
      # then requires the committed canonical assets to match byte for
      # byte. The packaged host checks stay a local gate: they install
      # pinned Pi CLIs into isolated homes.
      - name: Verify Generated and Bundle Drift
        run: pnpm run check:pi-phi-generated

      - name: Type Check Bridge
        run: pnpm --filter @phi/pi-phi run typecheck

      - name: Unit Test Bridge
        run: pnpm --filter @phi/pi-phi run test

      - name: Cross-Language IPC Integration
        run: pnpm run test:pi-phi:integration

  test-e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter phi-dev

      - name: Build web assets
        run: pnpm run build:web

      - name: Check vendored assets
        run: pnpm run check:vendors

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: pnpm exec playwright install chromium

      - name: Run Playwright suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
