name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -race -v ./...

      # Release builds embed precompressed assets behind -tags=embedassets
      # (see embed_release.go). Run the root-package tests against that
      # path so it cannot rot behind the tag.
      - name: Release-Tag Assets Smoke
        run: |
          go run ./tools/webdist
          go vet -tags=embedassets ./...
          go test -tags=embedassets -race .

  test-ts:
    name: TS Build + Type Check + Drift Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Format JS/TS
        run: pnpm run check:code

      - name: Lint CSS/HTML
        run: pnpm run lint:web

      - name: Type Check (web-src)
        run: pnpm run typecheck

      - name: Build Emitted JS
        run: pnpm run build:web

      # Drift guard. If web-src/*.ts sources are out of sync with
      # committed web/*.js artifacts, this fails the build. The
      # porcelain status catches both modified AND untracked files,
      # which a plain git diff --exit-code would not.
      - name: Verify Emitted Artifacts Clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- web)" ]; then
            echo "::error::Emitted web/ tree is out of sync with web-src/."
            git status --porcelain --untracked-files=all -- web
            exit 1
          fi

  test-js:
    name: JS Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS Tests
        run: pnpm test

      # Electron desktop shell (desktop/electron): a sibling npm package
      # with its own lockfile, NOT a member of the root pnpm workspace
      # (the root lockfile is unaffected). The electron postinstall
      # (prebuilt binary download) is approved via
      # desktop/electron/pnpm-workspace.yaml. The e2e smoke test
      # (test/smoke.test.ts) spawns the real Electron binary and is
      # intended for manual runs (the test contract documents its
      # skip conditions: missing dist/main.js, missing electron binary,
      # no display). It is excluded from CI gate so the unit/build/
      # typecheck flow stays green; the smoke test remains runnable
      # locally after `pnpm run build` for Windows / macOS bringup.
      - name: Electron Shell (build + typecheck + tests)
        run: |
          cd desktop/electron
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run typecheck
          pnpm exec vitest run --exclude test/smoke.test.ts
