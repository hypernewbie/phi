name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -race -v ./...

      # Release builds embed precompressed assets behind -tags=embedassets
      # (see embed_release.go). Run the root-package tests against that
      # path so it cannot rot behind the tag.
      - name: Release-Tag Assets Smoke
        run: |
          go run ./tools/webdist
          go vet -tags=embedassets ./...
          go test -tags=embedassets -race .

  test-ts:
    name: TS Build + Type Check + Drift Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter phi-dev

      - name: Check vendored assets
        run: pnpm run check:vendors

      - name: Lint and Format JS/TS
        run: pnpm run check:code

      - name: Lint CSS/HTML
        run: pnpm run lint:web

      - name: Type Check (web-src)
        run: pnpm run typecheck

      - name: Build Emitted JS
        run: pnpm run build:web

      # Drift guard. If web-src/*.ts sources are out of sync with
      # committed web/*.js artifacts, this fails the build. The
      # porcelain status catches both modified AND untracked files,
      # which a plain git diff --exit-code would not.
      - name: Verify Emitted Artifacts Clean
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- web)" ]; \
            then
            echo "::error::Emitted web/ tree is out of sync with web-src/."
            git status --porcelain --untracked-files=all -- web
            exit 1
          fi

  test-pet:
    name: Pet Type Check + Tests + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Pet Dependencies
        run: pnpm install --frozen-lockfile --filter @phi-desktop/pet

      - name: Type Check Pet
        run: pnpm --filter @phi-desktop/pet run typecheck

      - name: Test Pet
        run: pnpm --filter @phi-desktop/pet test

      - name: Build Pet
        run: pnpm --filter @phi-desktop/pet run build

  test-js:
    name: JS Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter phi-dev

      - name: Run JS Tests
        run: pnpm test

      # Electron desktop shell is a root-workspace package. Its postinstall
      # (prebuilt binary download) is approved in the root workspace config.
      # The e2e smoke test remains a local/manual gate because hosted runners
      # do not provide the required desktop display.
      - name: Electron Shell (build + typecheck + tests)
        run: |
          pnpm install --frozen-lockfile --filter phi-desktop-electron
          pnpm --filter phi-desktop-electron run build
          pnpm --filter phi-desktop-electron run typecheck
          pnpm --filter phi-desktop-electron exec vitest run \
            --exclude test/smoke.test.ts

  test-e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter phi-dev

      - name: Build web assets
        run: pnpm run build:web

      - name: Check vendored assets
        run: pnpm run check:vendors

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: pnpm exec playwright install chromium

      - name: Run Playwright suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
