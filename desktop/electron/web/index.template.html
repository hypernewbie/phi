<!doctype html>
<html lang="en" data-phi-desktop-root>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phi</title>
    <!-- Vendored assets (regenerated by scripts/vendor-web.mjs on every
         build): the browser Phi page's stylesheet and font faces, so the
         vendored header below renders identically to the browser page. -->
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <!-- The vendored .app-header (inlined from web/header.html by
         scripts/vendor-web.mjs — the same DOM the browser Phi page
         renders), decorated with the local caption controls. The header is
         the window's native drag row. -->
    <!--VENDORED_HEADER-->
    <!-- Empty body area: the host's WebContentsView children (the rail
         and the retained Phi bodies) are positioned below the header and
         paint over this div. It exists so the layout has an explicit
         anchor for the y=HEADER_HEIGHT..bottom region. -->
    <div id="body-area" class="desktop-body-area"></div>
    <!-- Access-auth modal: shown when the main process pushes
         'phi:auth-required' (the active server returns 401 on /api/config
         and reports access protection on /api/auth/status). Style and
         behavior are desktop-local (NO vendored .access-auth-* classes;
         no MessageBox; no popup window). Hidden until opened. -->
    <div id="desktop-auth-modal" class="desktop-auth-modal" role="dialog" aria-modal="true" aria-labelledby="desktop-auth-title" hidden>
      <form class="desktop-auth-card" novalidate>
        <h1 id="desktop-auth-title" class="desktop-auth-title">Unlock Phi</h1>
        <p id="desktop-auth-origin" class="desktop-auth-origin" aria-live="polite"></p>
        <label class="desktop-auth-field">
          <span>Access password</span>
          <input id="desktop-auth-input" type="password" autocomplete="current-password" required minlength="8" />
        </label>
        <p id="desktop-auth-error" class="desktop-auth-error" role="alert" aria-live="assertive"></p>
        <div class="desktop-auth-actions">
          <button id="desktop-auth-cancel" type="button" class="desktop-auth-btn desktop-auth-btn-secondary">Cancel</button>
          <button id="desktop-auth-submit" type="submit" class="desktop-auth-btn desktop-auth-btn-primary">Unlock</button>
        </div>
      </form>
    </div>
    <script type="module" src="./mainview.js"></script>
  </body>
</html>
