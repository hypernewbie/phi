<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phi</title>
    <!-- The vendored UI fonts (Inter + JetBrains Mono) so the rail's
         Greek server glyphs render in the same typeface the web page
         uses; regenerated by scripts/vendor-web.mjs on every build. -->
    <link rel="stylesheet" href="../web/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="./rail.css" />
  </head>
  <body>
    <!-- Step-6 server rail page. The list is populated at runtime by
         dist/renderer.js (compiled from src/renderer.ts) from phi:rail-state
         snapshots pushed by the main process; the add button opens the
         add-server picker (window.electron.postOpenPicker). The page
         itself carries no server data. -->
    <aside id="rail">
      <ul id="rail-list" aria-label="Saved servers"></ul>
      <div id="rail-menu" hidden></div>
      <button id="rail-add" type="button" aria-label="Add server">+</button>
    </aside>
    <noscript>
      phi-desktop: the rail requires JavaScript
    </noscript>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
