<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phi</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Phase-1 placeholder server rail: a 64px CSS sidebar. The real
           per-profile rail with one retained view per server is a later
           migration slice. -->
      <aside class="rail" id="rail" aria-label="Server rail">
        <div class="rail-mark" aria-hidden="true">Φ</div>
        <div class="rail-caption">phase 1</div>
      </aside>
      <main class="pane" id="pane">
        <h1 class="pane-title">phi-desktop electron shell — phase 1</h1>
        <p class="pane-note">
          Inert scaffold: one BrowserWindow, one local page, no multi-server
          views, no popups, no IPC, no tray, no hotkeys, no protocol
          registration yet.
        </p>
      </main>
    </div>
  </body>
</html>
