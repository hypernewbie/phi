// Canonical Phi ↔ Phi contract for the Syncboard mesh.
//
// One service carries addressed agent messages and board change events
// between Phi servers that share a Syncboard coordinator. Browser ↔ Phi
// traffic is not part of this contract; it stays HTTP and WebSocket.
//
// phi.sync.v1 reserves sequence and field numbers across releases.
// seq is per publisher, not global; acknowledgements key on message_id.
// See research/20261103-1224-syncboard-push-to-pi.md for the delivery
// model and plan/20261103-1224-syncboard-push-to-pi.md for the rollout.
syntax = "proto3";

package phi.sync.v1;

option go_package = "github.com/hypernewbie/phi/internal/syncmesh/pb;syncmeshb";

// ---------------------------------------------------------------------------
// Wire types
// ---------------------------------------------------------------------------

// SyncEvent is one ordered change from a single publisher. gap means every
// event before this one is unavailable; the receiver refetches board state
// instead of inferring a gap from a missing seq.
message SyncEvent {
  uint64 seq = 1;
  string sender = 2;
  string recipient = 3;
  bytes value = 4;
  int64 updated_at_unix_ms = 5;
  bool gap = 6;
  // Caller-supplied idempotency key. Receivers dedupe on it, so a replayed
  // event after a reconnect never produces a second injection.
  string message_id = 7;
}

// SubscribeRequest opens one publisher-scoped stream. since_seq 0 starts at
// the oldest retained event. recipient filters on the receiving agent id;
// "*" or an empty value accepts every recipient.
message SubscribeRequest {
  uint64 since_seq = 1;
  string recipient = 2;
}

// PublishRequest asks a Phi to accept one addressed message. sender is
// deliberately absent: it is stamped from the authenticated caller so a
// client cannot publish as another agent.
message PublishRequest {
  // Caller-supplied idempotency key. Reusing it returns the original seq
  // with duplicate set, and emits no second event.
  string message_id = 1;
  // Receiving agent id, or "*" for every subscriber.
  string recipient = 2;
  bytes value = 3;
  // Relay count. A publisher rejects values above the agreed limit.
  uint32 hops = 4;
}

// PublishResponse returns the stored sequence for the message. duplicate
// reports that message_id was already present.
message PublishResponse {
  uint64 seq = 1;
  bool duplicate = 2;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service SyncMesh {
  // Subscribe streams one publisher's events, oldest first, then live.
  rpc Subscribe(SubscribeRequest) returns (stream SyncEvent);
  // Publish stores one addressed message and fans it out.
  rpc Publish(PublishRequest) returns (PublishResponse);
}
