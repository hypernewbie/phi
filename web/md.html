<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        >
        <title>Φ phi</title>
        <script type="module" src="prepaint.js"></script>
        <link rel="stylesheet" href="vendor/fonts/fonts.css">
        <link rel="stylesheet" href="vendor/highlight-github-dark.min.css">
        <link rel="stylesheet" href="style.css">
        <script src="vendor/marked.min.js"></script>
        <script src="vendor/highlight.min.js"></script>
        <script src="vendor/purify.min.js"></script>
    </head>
    <body class="md-standalone">
        <main id="md-view-body"><div class="md-rendering">Loading…</div></main>
        <script type="module">
        import { initMdView } from './md-view.js';
        import { bootstrapAccessAuth } from './auth.js';
        const params = new URL(location.href).searchParams;
        // Static help/changelog pages are public and must not prompt. Dynamic
        // workspace files finish auth before the protected fetch and events
        // socket start.
        if (params.get('page')) {
            initMdView();
        } else {
            bootstrapAccessAuth().then(
                () => initMdView(),
                () => {
                    const body = document.getElementById('md-view-body');
                    if (body)
                        body.innerHTML =
                            '<div class="md-list-error">Phi access could not be checked. <a href="">Reload</a></div>';
                },
            );
        }
        </script>
    </body>
</html>
